name: Native Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Build and validate all Windows formats
        shell: powershell
        run: ./BUILD_WINDOWS.ps1
      - name: Preserve complete validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: optilab-core-validation-logs
          path: |
            BUILD_WINDOWS_LOG.txt
            validation-logs/**
          if-no-files-found: warn
      - name: Upload tested package
        uses: actions/upload-artifact@v7
        with:
          name: optilab-core-release-candidate
          path: dist/OptiLab-Core-*-Windows.zip
          if-no-files-found: error
